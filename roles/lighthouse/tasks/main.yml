---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Download Lighthouse archive
  ansible.builtin.get_url:
    url: https://github.com/VKCOM/lighthouse/archive/refs/heads/master.tar.gz
    dest: /tmp/lighthouse.tar.gz
    mode: "0644"

- name: Create Lighthouse directory
  ansible.builtin.file:
    path: /var/www/lighthouse
    state: directory
    mode: "0755"

- name: Extract Lighthouse archive
  ansible.builtin.unarchive:
    src: /tmp/lighthouse.tar.gz
    dest: /var/www/lighthouse
    remote_src: true
    extra_opts:
      - --strip-components=1
  when: not ansible_check_mode

- name: Configure Nginx
  ansible.builtin.template:
    src: lighthouse.conf.j2
    dest: /etc/nginx/sites-available/lighthouse.conf
    mode: "0644"
  notify: Restart Nginx

- name: Enable Lighthouse site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lighthouse.conf
    dest: /etc/nginx/sites-enabled/lighthouse.conf
    state: link
  notify: Restart Nginx

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx

- name: Start and enable Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
